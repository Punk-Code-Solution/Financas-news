# Deploy Clareza Capital na Railway — https://financas-news.net.br
# Secrets só no painel Variables — nunca neste arquivo.
#
# Obrigatório:
#   USE_LOCAL_DB=true, GOOGLE_API_KEY, ROBO_TOKEN
#   SITE_ORIGIN=https://financas-news.net.br
# Volume: RAILWAY_VOLUME_MOUNT_PATH → SQLite {mount}/news.db,
#         capas em {mount}/article_images, avatares em {mount}/avatars
# TURSO_* opcional — só para a migração única GET/POST /api/import-from-turso
# Crons: ops/crons.md (cron-job.org + Bearer; não use Cron Schedule neste serviço web)

[build]
builder = "RAILPACK"
buildCommand = "pip install -r requirements.txt"

[deploy]
startCommand = "uvicorn main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/ping"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
