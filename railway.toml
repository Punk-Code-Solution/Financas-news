# Deploy Clareza Capital / Finanças News na Railway.
# Secrets (ROBO_TOKEN, TURSO_*, GOOGLE_API_KEY*, etc.) só no painel — nunca neste arquivo.
# Volume opcional: monte em /data e defina ARTICLE_IMAGES_DIR=/data/article_images.

[build]
builder = "RAILPACK"
buildCommand = "pip install -r requirements.txt"

[deploy]
startCommand = "uvicorn main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/ping"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
