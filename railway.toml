# Deploy Clareza Capital na Railway — https://www.financas-news.net.br
# Secrets só no painel Variables — nunca neste arquivo.
#
# Obrigatório:
#   TURSO_DATABASE_URL, TURSO_AUTH_TOKEN, GOOGLE_API_KEY, ROBO_TOKEN
#   SITE_ORIGIN=https://www.financas-news.net.br
# Volume: RAILWAY_VOLUME_MOUNT_PATH → capas em {mount}/article_images
# Crons: ops/crons.md (cron-job.org + Bearer; não use Cron Schedule neste serviço web)

[build]
builder = "RAILPACK"
buildCommand = "pip install -r requirements.txt"

[deploy]
startCommand = "uvicorn main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/ping"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
