# Deploy Clareza Capital / Finanças News na Railway.
# Secrets só no painel Variables — nunca neste arquivo.
#
# Obrigatório (mesmo banco do Render):
#   TURSO_DATABASE_URL, TURSO_AUTH_TOKEN, GOOGLE_API_KEY, ROBO_TOKEN, SITE_ORIGIN
# Volume: Railway define RAILWAY_VOLUME_MOUNT_PATH; capas vão para {mount}/article_images.
# Alternativa SQLite no volume (banco vazio, separado do Render):
#   USE_LOCAL_DB=true

[build]
builder = "RAILPACK"
buildCommand = "pip install -r requirements.txt"

[deploy]
startCommand = "uvicorn main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/ping"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
