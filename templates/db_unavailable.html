<!DOCTYPE html>
<html lang="{{ html_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t('db_unavailable_title') }} | {{ t('site_name') }}</title>
    <meta name="robots" content="noindex, follow">
    <meta name="description" content="{{ t('db_unavailable_body') }}">
    <link rel="icon" href="/static/favicon.svg?v=2" type="image/svg+xml">
    {% include "partials/_styles.html" %}
    <script>
        if (localStorage.getItem('color-theme') === 'dark') {
            document.documentElement.classList.add('dark');
        } else { document.documentElement.classList.remove('dark'); }
    </script>
</head>
<body class="bg-gray-50 dark:bg-[#0f172a] text-gray-800 dark:text-slate-200 transition-colors duration-200 flex flex-col min-h-screen">
    <nav class="border-b border-gray-200 dark:border-slate-800 bg-white dark:bg-[#0f172a] pt-4 pb-4">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <a href="{{ lp('/') }}" class="text-2xl font-black tracking-tighter">
                <span class="text-green-600 dark:text-[#4ade80]">{{ t('brand_finance') }}</span><span class="text-gray-900 dark:text-white">{{ t('brand_news') }}</span>
            </a>
            {% include "partials/_lang_switcher.html" %}
        </div>
    </nav>
    <main class="container mx-auto px-4 py-16 max-w-xl flex-grow">
        <h1 class="text-2xl font-extrabold text-gray-900 dark:text-white mb-4">{{ t('db_unavailable_title') }}</h1>
        <p class="text-gray-600 dark:text-slate-300 mb-8">{{ t('db_unavailable_body') }}</p>
        <a href="{{ lp('/') }}" class="inline-flex min-h-11 items-center px-4 py-2 rounded-lg bg-green-600 text-white font-semibold hover:bg-green-700">{{ t('db_unavailable_retry') }}</a>
    </main>
    {% include "partials/_footer.html" %}
</body>
</html>
