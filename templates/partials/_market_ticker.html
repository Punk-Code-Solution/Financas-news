{# Barra de cotações — componente isolado (estilo Cointelegraph).
   CSS + markup aqui; lógica em /static/js/market-ticker.js #}
<style>
    .fn-ticker {
        --fn-ticker-bg: linear-gradient(90deg, #eff6ff 0%, #ffffff 48%, #f0fdfa 100%);
        --fn-ticker-border: #bfdbfe;
        --fn-ticker-label: #1d4ed8;
        --fn-ticker-bid: #0f172a;
        --fn-ticker-up: #047857;
        --fn-ticker-up-bg: #d1fae5;
        --fn-ticker-down: #be123c;
        --fn-ticker-down-bg: #ffe4e6;
        --fn-ticker-code-bg: #dbeafe;
        background: var(--fn-ticker-bg);
        border-bottom: 1px solid var(--fn-ticker-border);
        color: var(--fn-ticker-label);
        box-shadow: inset 0 -1px 0 rgba(37, 99, 235, 0.05);
        font-size: 0.76rem;
        line-height: 1.25;
        transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }
    .dark .fn-ticker {
        --fn-ticker-bg: linear-gradient(90deg, #07111f 0%, #101827 48%, #071a1a 100%);
        --fn-ticker-border: #23334d;
        --fn-ticker-label: #7dd3fc;
        --fn-ticker-bid: #f8fafc;
        --fn-ticker-up: #6ee7b7;
        --fn-ticker-up-bg: rgba(5, 150, 105, 0.2);
        --fn-ticker-down: #fda4af;
        --fn-ticker-down-bg: rgba(225, 29, 72, 0.2);
        --fn-ticker-code-bg: rgba(14, 165, 233, 0.14);
    }
    .fn-ticker__viewport {
        overflow: hidden;
        white-space: nowrap;
        padding: 0.42rem 0;
    }
    .fn-ticker__track {
        display: flex;
        width: max-content;
        animation: fn-ticker-scroll 160s linear infinite;
        will-change: transform;
    }
    .fn-ticker__track:hover {
        animation-play-state: paused;
        cursor: default;
    }
    .fn-ticker__group {
        display: flex;
        flex-shrink: 0;
        align-items: center;
    }
    .fn-ticker__item {
        display: inline-flex;
        align-items: center;
        gap: 0.42rem;
        margin-right: 1.85rem;
        font-weight: 600;
        letter-spacing: 0.015em;
    }
    .fn-ticker__code {
        color: var(--fn-ticker-label);
        background: var(--fn-ticker-code-bg);
        border-radius: 0.25rem;
        padding: 0.14rem 0.3rem;
        font-size: 0.68rem;
        font-weight: 800;
        letter-spacing: 0.045em;
    }
    .fn-ticker__bid {
        color: var(--fn-ticker-bid);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        transition: color 0.2s ease;
    }
    .fn-ticker__pct {
        border-radius: 999px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        padding: 0.12rem 0.36rem;
    }
    .fn-ticker__pct.ticker-up {
        color: var(--fn-ticker-up);
        background: var(--fn-ticker-up-bg);
    }
    .fn-ticker__pct.ticker-down {
        color: var(--fn-ticker-down);
        background: var(--fn-ticker-down-bg);
    }
    .fn-ticker__item.is-passing .fn-ticker__bid,
    .fn-ticker__item.is-passing .fn-ticker__pct {
        animation: fn-ticker-flash 0.85s ease;
    }
    .fn-ticker__item.is-passing.is-tick-up .fn-ticker__bid {
        color: var(--fn-ticker-up);
    }
    .fn-ticker__item.is-passing.is-tick-down .fn-ticker__bid {
        color: var(--fn-ticker-down);
    }
    .fn-ticker__bid.is-flash,
    .fn-ticker__pct.is-flash {
        animation: fn-ticker-flash 0.85s ease;
    }
    @keyframes fn-ticker-scroll {
        from { transform: translateX(0); }
        to { transform: translateX(-50%); }
    }
    @keyframes fn-ticker-flash {
        0% { opacity: 0.35; transform: translateY(2px); }
        40% { opacity: 1; transform: translateY(0); }
        100% { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
        .fn-ticker__track { animation: none; }
        .fn-ticker__bid.is-flash,
        .fn-ticker__pct.is-flash,
        .fn-ticker__item.is-passing .fn-ticker__bid,
        .fn-ticker__item.is-passing .fn-ticker__pct { animation: none; }
    }
</style>
<div class="fn-ticker" aria-label="{{ t('ticker_aria') }}">
    <div class="fn-ticker__viewport">
        <div
            class="fn-ticker__track"
            id="market-ticker"
            data-ticker-animated="true"
            data-locale="{{ number_locale }}"
            role="presentation"
        ></div>
    </div>
</div>
<script src="/static/js/market-ticker.js" defer></script>
