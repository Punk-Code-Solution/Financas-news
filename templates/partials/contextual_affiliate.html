{# Afiliado contextual por categoria — só renderiza se URL configurada. #}
{% if contextual_affiliate %}
<aside class="mt-6 pt-6 border-t border-emerald-200/60 dark:border-emerald-900/40" aria-label="{{ t('affiliate_disclaimer') }}">
    <p class="text-[10px] font-black uppercase text-gray-500 dark:text-slate-400 mb-2">{{ t('next_step_partner') }}</p>
    <a href="{{ contextual_affiliate.url }}" target="_blank" rel="noopener sponsored"
       class="block bg-white/80 dark:bg-[#0f172a] border border-gray-200 dark:border-slate-700 rounded-xl p-4 hover:border-emerald-400 dark:hover:border-[#4ade80] transition">
        <p class="text-sm font-black text-gray-900 dark:text-white">{{ contextual_affiliate.titulo }}</p>
        <p class="mt-1 text-xs text-gray-600 dark:text-slate-400">{{ contextual_affiliate.descricao }}</p>
        <span class="mt-2 inline-block text-xs font-bold text-emerald-700 dark:text-[#4ade80]">{{ contextual_affiliate.cta }} →</span>
    </a>
    <p class="mt-2 text-[10px] text-gray-400 dark:text-slate-500">{{ t('affiliate_disclaimer') }}</p>
</aside>
{% endif %}
